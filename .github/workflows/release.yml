# Release workflow for @obvi/feedback-sdk using npm Trusted Publisher (OIDC).
#
# Setup required before this can publish:
# 1. Configure Trusted Publisher for @obvi/feedback-sdk on npm:
#    FlatFilers / obvious-feedback-sdk / release.yml
# 2. Bump the version in package.json before creating a release tag.
#
# To trigger a release:
#   gh release create v1.0.X --title "v1.0.X" --notes "..."

name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Use latest npm for trusted publishing
        run: npm install -g npm@latest

      - name: Show npm version
        run: npm --version

      - name: Publish to npm
        run: npm publish --provenance --access public
