# Release workflow for @obvi/feedback-sdk
#
# Setup required before this can publish:
# 1. The @obvi npm scope must allow publishing from this repo's automation token.
#    Either grant FlatFilers org access to the scope, or use a token from an
#    account that already has publish access (currently @dboskovic).
# 2. Add an NPM_TOKEN secret at:
#    https://github.com/FlatFilers/obvious-feedback-sdk/settings/secrets/actions
#    Use a Granular Access Token scoped to @obvi/feedback-sdk with publish permission.
# 3. Bump the version in package.json before creating a release tag.
#
# To trigger a release:
#   gh release create v1.0.X --title "v1.0.X" --notes "..."

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
